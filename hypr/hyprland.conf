$mod  = SUPER
$term = kitty

# ────────────── Monitors ──────────────
# SOURCE OF TRUTH: nwg-displays. Arrange + Apply in its GUI; it writes monitors.conf
# (sourced below) and runs `hyprctl reload`, which applies it. Caveats of this model:
#  - An Apply saves ONLY the outputs connected at that moment and replaces the whole
#    file — re-arrange + Apply once per location (dock / LG / standalone).
#  - Never Apply with the internal panel toggled OFF in the GUI: that persists
#    `eDP-1, disable`, and the lid-open reload in lid-setup.sh would then keep the
#    panel dark (a statically disabled sole output is also the known crash trap).
#  - Pick scale 1.8 for eDP-1 in the GUI, never 1.75: 2880/1.8=1600, 1800/1.8=1000
#    (integer logical size); Hyprland rejects 1.75 with the "invalid scale" popup.
#  - lid-setup.sh still owns lid behavior: disable on close when docked, config
#    reload on open (no geometry is hardcoded there anymore).
source = ~/.config/hypr/monitors.conf

# ── Static rules superseded by monitors.conf above; kept for reference ──
# All docked outputs got EXPLICIT positions. Do NOT rely on `auto`: when the
# lid toggles eDP-1 on/off, `auto` re-packs the externals and shifts them sideways
# by eDP-1's width (~1646px), which corrupts the layout. Explicit positions stay put.
# (This still applies when arranging in nwg-displays — it writes explicit positions.)
# monitor = HDMI-A-1, 2560x1440@59.95,  2720x-1440, 1.0  # above (ASUS via HDMI; centered above 4K: 4K center x=4000, 2560/2=1280 → x=2720; y=-1440 = its logical height, bottom meets 4K top at y=0)
# monitor = DP-1,     3840x2160@144.05, 2560x0,  1.3333 # center (4K @144 Hz; scale 4/3 → exactly 2880x1620 logical, flush against Samsung at 5440)
# monitor = DP-10,    2560x1440@59.95,  5440x90, 1.0    # right  (Samsung; flush: 2560 + 2880 logical = 5440; y=90 centered)
# monitor = eDP-1,    2880x1800@60,     0x0, 1.8        # internal
# monitor = desc:LG Electronics LG FHD 302NTLE82432, 1920x1080@59.93, 1600x0, 1  # LG, right of internal
# monitor = , preferred, auto, 1                       # fallback (unlisted outputs now get Hyprland's built-in default: preferred, auto, scale 1)

# ────────────── Plugins: split-monitor-workspaces ──────────────
# Per-monitor workspaces (niri/awesome-style): $mod+N = Nth workspace on the
# focused monitor. `count` = workspaces per monitor. `monitor_priority` pins the
# numbering order so global IDs stay stable across lid open/close & hotplug.
# Installed via hyprpm; loaded at startup by the `exec-once = hyprpm reload -n` below.
plugin {
    split-monitor-workspaces {
        count = 9
        enable_persistent_workspaces = 1
        enable_wrapping = 1
        keep_focused = 0
        enable_notifications = 0
        monitor_priority = HDMI-A-1, DP-1, DP-10, eDP-1
    }
}

# ────────────── Environment ──────────────
# Ported from niri cfg/misc.kdl `environment {}` (XDG_CURRENT_DESKTOP set to Hyprland)
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = ELECTRON_OZONE_WL,1
env = NIXOS_OZONE_WL,1
# Cursor (capitaine-cursors @ 24, same as niri); use xcursor (no hyprcursor theme installed)
env = XCURSOR_THEME,capitaine-cursors
env = XCURSOR_SIZE,24

# ────────────── Input ──────────────
# Ported from niri cfg/input.kdl
input {
    kb_layout         = pl
    repeat_delay      = 350
    repeat_rate       = 75
    numlock_by_default = true
    follow_mouse      = 1
    sensitivity       = 0.2        # niri mouse accel-speed 0.2
    accel_profile     = flat       # niri mouse accel-profile "flat"
    scroll_factor     = 1.6

    touchpad {
        natural_scroll = true
        scroll_factor  = 0.7
        tap-to-click   = true
    }
}

# niri used adaptive accel for the touchpad but flat for the mouse. Hyprland's
# accel_profile is global, so the touchpad inherits "flat" above. If the
# touchpad feels sluggish, uncomment + fill in your device name (`hyprctl devices`):
# device {
#     name = <your-touchpad-name>
#     accel_profile = adaptive
# }

# ────────────── Look & feel ──────────────
# Ported from niri cfg/layout.kdl (focus-ring 2px, #7fc8db active / #505050 inactive,
# gaps 4, corner radius 20).
general {
    gaps_in           = 2
    gaps_out          = 4
    border_size       = 2
    col.active_border   = rgb(7fc8db)
    col.inactive_border = rgb(505050)
    layout            = dwindle
    resize_on_border  = true
}

decoration {
    rounding = 20

    # Global window transparency — all windows slightly see-through
    active_opacity = 1
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0   # keep fullscreen apps/video/games fully opaque

    blur {
        enabled = false
    }
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    force_default_wallpaper  = 0     # Noctalia draws the wallpaper
}

cursor {
    # Matches niri's `disable-cursor-plane` amdgpu workaround
    # (HW cursor shows black/invisible on this GPU).
    no_hardware_cursors = true
}

animations {
    enabled = true
    bezier  = ease, 0.25, 0.1, 0.25, 1
    animation = windows,    1, 4, ease
    animation = windowsOut, 1, 4, ease, popin 80%
    animation = fade,       1, 4, ease
    animation = workspaces, 0
    animation = border,     1, 6, ease
}

# ────────────── Window rules ──────────────
# NOTE: Hyprland 0.55 deprecated the classic hyprlang `windowrule = float, class:...`
# form (config is migrating to Lua; valueless rules like float/tile error out on this
# build — verified empirically). The rest of this file is hyprlang and works fine.
# To add floating rules (e.g. pavucontrol, steam) later, use the current syntax at
# https://wiki.hypr.land (Configuring → Window Rules), or test live with:
#   hyprctl keyword windowrule "float, class:^(pavucontrol)$"
# and keep whatever form hyprctl accepts without a "configerrors" complaint.
# Update (2026-06-27): even VALUED rules with a class: matcher fail the same way —
# e.g. `opacity 0.95, class:^(kitty)$` -> "invalid field class:^(kitty)$: missing a value".
# So: global window transparency uses decoration{} active/inactive_opacity (set above);
# per-app opacity must use the app's own setting (e.g. kitty background_opacity).

# windowrule = match:class .*, float true # Float all windows by default
windowrule = match:class .*, size 80% 80% # Default floating size: 80% of monitor

# ────────────── Autostart (Noctalia shell + agents) ──────────────
# IMPORTANT: this is the SAME mechanism niri uses. Noctalia runs as the
# user service `noctalia-shell.service` (= `qs -c noctalia-shell`) and shares
# ~/.config/noctalia with niri. We first push the Wayland env into systemd/dbus
# so the service attaches to THIS Hyprland session, then (re)start it.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE; systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE; systemctl --user start hyprland-session.target; sleep 1; systemctl --user restart noctalia-shell.service
# polkit authentication agent — MUST be a child of the compositor so it lands in
# THIS graphical session (seat0) with DISPLAY set; that's what pkexec/polkit looks up.
# The user-manager service (polkit-gnome-agent.service) can't: it runs in the manager
# session (wrong seat) and lacked DISPLAY, so it crash-looped → no agent → pkexec 127.
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# Raise the focused window on every focus change (no built-in option in 0.55;
# socket2 listener dispatching `alterzorder top` on activewindowv2 events)
exec-once = ~/.config/hypr/focus-raise.py
# Fallback solid background behind Noctalia's wallpaper (matches niri's swaybg)
exec-once = swaybg -i /dev/null -c 1e1e2e
# Apply cursor theme to the running session
exec-once = hyprctl setcursor capitaine-cursors 24
exec-once = hyprpm reload -n            # load hyprpm plugins (split-monitor-workspaces) at startup

# ════════════════════ Keybinds (ported from niri cfg/keybinds.kdl) ════════════════════

# ─── Applications ───
bind = $mod, Q,       exec, $term
bind = $mod SHIFT, Q, exit,
bind = $mod, C,       killactive,
bind = $mod, D,       exec, qs ipc --any-display -c noctalia-shell call launcher toggle
# niri's Mod+Grave toggle-overview has no native Hyprland equivalent; this maps it
# to the scratchpad. For a real overview, install the `hyprexpo` plugin (hyprpm) and use:
#   bind = $mod, grave, hyprexpo:expo, toggle
bind = $mod, grave,   togglespecialworkspace, magic

# ─── Media controls (work while locked; volume/brightness repeat) ───
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bindl  = , XF86AudioMute,         exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous

# ─── Lid switch (auto-disable internal panel when closed; restore on open) ───
# Both binds share lid-setup.sh: lid closed + docked → disable eDP-1; lid open →
# `hyprctl reload`, which re-enables eDP-1 and re-asserts monitors.conf (nwg-displays
# owns all geometry now — the script no longer hardcodes positions or scale).
bindl  = , switch:on:Lid Switch,  exec, ~/.config/hypr/lid-setup.sh
bindl  = , switch:off:Lid Switch, exec, ~/.config/hypr/lid-setup.sh
# Lid binds only fire on a state CHANGE. Reconcile once at startup against the real
# ACPI lid state (covers booting at the dock with the lid already closed).
exec-once = ~/.config/hypr/lid-setup.sh

# ─── Brightness ───
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ─── Window focus ───
bind = $mod, H,     movefocus, l
bind = $mod, L,     movefocus, r
bind = $mod, J,     movefocus, d
bind = $mod, K,     movefocus, u
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, down,  movefocus, d
bind = $mod, up,    movefocus, u

# ─── Monitor focus ───
bind = $mod CTRL, H,     focusmonitor, l
bind = $mod CTRL, L,     focusmonitor, r
bind = $mod CTRL, J,     focusmonitor, d
bind = $mod CTRL, K,     focusmonitor, u
bind = $mod CTRL, left,  focusmonitor, l
bind = $mod CTRL, right, focusmonitor, r
bind = $mod CTRL, down,  focusmonitor, d
bind = $mod CTRL, up,    focusmonitor, u

# ─── Move window ───
bind = $mod SHIFT, H,     movewindow, l
bind = $mod SHIFT, L,     movewindow, r
bind = $mod SHIFT, J,     movewindow, d
bind = $mod SHIFT, K,     movewindow, u
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, down,  movewindow, d
bind = $mod SHIFT, up,    movewindow, u

# ─── Move window to monitor (directional) ───
bind = $mod ALT, H,     movewindow, mon:l
bind = $mod ALT, L,     movewindow, mon:r
bind = $mod ALT, J,     movewindow, mon:d
bind = $mod ALT, K,     movewindow, mon:u
bind = $mod ALT, left,  movewindow, mon:l
bind = $mod ALT, right, movewindow, mon:r
bind = $mod ALT, down,  movewindow, mon:d
bind = $mod ALT, up,    movewindow, mon:u

# ─── Workspace switching (per-monitor, by VISIBLE position — see ws-nav.sh) ───
# Navigates the workspaces actually shown on the focused monitor (matches the bar),
# so workspaces migrated from an unplugged monitor stay reachable. Wraps around.
bind = $mod, page_down, exec, ~/.config/hypr/ws-nav.sh next
bind = $mod, page_up,   exec, ~/.config/hypr/ws-nav.sh prev
bind = $mod, U,         exec, ~/.config/hypr/ws-nav.sh next
bind = $mod, I,         exec, ~/.config/hypr/ws-nav.sh prev
bind = $mod SHIFT, page_down, exec, ~/.config/hypr/ws-nav.sh movenext
bind = $mod SHIFT, page_up,   exec, ~/.config/hypr/ws-nav.sh moveprev
bind = $mod SHIFT, U,         exec, ~/.config/hypr/ws-nav.sh movenext
bind = $mod SHIFT, I,         exec, ~/.config/hypr/ws-nav.sh moveprev

# ─── Workspace numbers ($mod+N = Nth workspace SHOWN on the focused monitor) ───
# Uses ws-nav.sh (position-based) instead of split-workspace (block-based) so $mod+N
# always matches the Nth label in the bar — including workspaces that migrated onto this
# monitor from one you unplugged. In normal multi-monitor use this is identical to
# split-workspace (a monitor only holds its own block). See ws-nav.sh for the why.
bind = $mod, 1, exec, ~/.config/hypr/ws-nav.sh go 1
bind = $mod, 2, exec, ~/.config/hypr/ws-nav.sh go 2
bind = $mod, 3, exec, ~/.config/hypr/ws-nav.sh go 3
bind = $mod, 4, exec, ~/.config/hypr/ws-nav.sh go 4
bind = $mod, 5, exec, ~/.config/hypr/ws-nav.sh go 5
bind = $mod, 6, exec, ~/.config/hypr/ws-nav.sh go 6
bind = $mod, 7, exec, ~/.config/hypr/ws-nav.sh go 7
bind = $mod, 8, exec, ~/.config/hypr/ws-nav.sh go 8
bind = $mod, 9, exec, ~/.config/hypr/ws-nav.sh go 9
bind = $mod SHIFT, 1, exec, ~/.config/hypr/ws-nav.sh move 1
bind = $mod SHIFT, 2, exec, ~/.config/hypr/ws-nav.sh move 2
bind = $mod SHIFT, 3, exec, ~/.config/hypr/ws-nav.sh move 3
bind = $mod SHIFT, 4, exec, ~/.config/hypr/ws-nav.sh move 4
bind = $mod SHIFT, 5, exec, ~/.config/hypr/ws-nav.sh move 5
bind = $mod SHIFT, 6, exec, ~/.config/hypr/ws-nav.sh move 6
bind = $mod SHIFT, 7, exec, ~/.config/hypr/ws-nav.sh move 7
bind = $mod SHIFT, 8, exec, ~/.config/hypr/ws-nav.sh move 8
bind = $mod SHIFT, 9, exec, ~/.config/hypr/ws-nav.sh move 9

# ─── Monitor targets (HDMI-A-1 = left, eDP-1 = main/right) ───
bind = $mod CTRL, 1, focusmonitor, HDMI-A-1
bind = $mod CTRL, 2, focusmonitor, eDP-1
bind = $mod, W,       focusmonitor, HDMI-A-1
bind = $mod, E,       focusmonitor, eDP-1
bind = $mod SHIFT, W, movewindow, mon:HDMI-A-1
bind = $mod SHIFT, E, movewindow, mon:eDP-1

# ─── Layout controls ───
bind = $mod, F,       fullscreen, 1      # maximize within gaps (~ niri maximize-column)
bind = $mod SHIFT, F, fullscreen, 0      # true fullscreen (~ niri fullscreen-window)
bind = $mod, minus,       resizeactive, -10% 0
bind = $mod, equal,       resizeactive,  10% 0
bind = $mod SHIFT, minus, resizeactive, 0 -10%
bind = $mod SHIFT, equal, resizeactive, 0  10%
bind = $mod, V, layoutmsg, togglesplit   # flip dwindle split orientation (H ↔ V)
# niri column consume/expel → Hyprland tab-group ops (closest analog)
bind = $mod, comma,  togglegroup,
bind = $mod, period, moveoutofgroup,
# Floating (not in niri, handy in Hyprland's dynamic tiling)
bind = $mod SHIFT, space, togglefloating,

# ─── Screenshots (niri built-in → grim/slurp helper) ───
bind = ,     Print, exec, ~/.config/hypr/screenshot.sh region
bind = CTRL, Print, exec, ~/.config/hypr/screenshot.sh output
bind = ALT,  Print, exec, ~/.config/hypr/screenshot.sh window

# ─── Power ───
bind = $mod CTRL, P, exec, qs ipc --any-display -c noctalia-shell call sessionMenu lockAndSuspend
bind = $mod SHIFT, P, dpms, off          # power-off-monitors; any input wakes them

# ─── Mouse (drag to move/resize — Hyprland needs these explicitly) ───
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
